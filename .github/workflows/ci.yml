name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      UV_CACHE_DIR: /tmp/backchannel-uv-cache
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci
      - run: uv sync --frozen --all-groups
      - run: npm run check
      - run: npm run smoke:stub
      - run: npm run smoke:production
      - run: npm run openapi:check
      - run: npm run secret:scan

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      OPENAI_API_KEY: ""
      BACKCHANNEL_SMOKE_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci
      - run: uv sync --frozen --all-groups
      - run: docker build --pull -t backchannel:build-week .
      - name: Prepare masked non-disclosure canary
        run: |
          release_canary="sk-ci-$(openssl rand -hex 24)"
          echo "::add-mask::$release_canary"
          printf 'BACKCHANNEL_SMOKE_CANARY=%s\n' "$release_canary" >> "$GITHUB_ENV"
      - name: Start packaged app
        run: |
          docker run --rm -d --name backchannel-ci -p 8000:8000 \
            -e BACKCHANNEL_ALLOWED_HOSTS=127.0.0.1 \
            -e BACKCHANNEL_CORS_ORIGINS=https://judge.example \
            -e BACKCHANNEL_IDENTITY_HASH_SECRET=ci-container-identity-boundary-0123456789 \
            -e OPENAI_API_KEY="$BACKCHANNEL_SMOKE_CANARY" \
            backchannel:build-week
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          exit 1
      - run: npm run smoke:docker
      - run: npm run smoke:container:restart
      - if: always()
        run: docker stop backchannel-ci || true
