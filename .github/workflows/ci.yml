name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ""
      UV_CACHE_DIR: /tmp/backchannel-uv-cache
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          architecture: x64
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.1"
          checksum: "8b5af2d678da1bdae80a5107c934f6ab010c6cdeb2de5b8e07568031d9486051"
      - name: Verify pinned CI toolchain
        run: |
          test "$RUNNER_ARCH" = "X64"
          test "$(python -I -S -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test "$(uv --version)" = "uv 0.10.1"
          printf '%s  %s\n' \
            "e5571c1b0f31deec7f79ca60381f04a89f6cfe68f9b0d1c98cc2d372ec844bca" \
            "$(command -v uv)" | sha256sum --check --status
      - run: npm ci
      - run: uv sync --frozen --all-groups
      - run: npm run check
      - run: npm run smoke:stub
      - run: npm run smoke:production
      - run: npm run openapi:check
      - run: npm run secret:scan

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      OPENAI_API_KEY: ""
      BACKCHANNEL_SMOKE_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.13"
          architecture: x64
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.1"
          checksum: "8b5af2d678da1bdae80a5107c934f6ab010c6cdeb2de5b8e07568031d9486051"
      - name: Verify pinned CI toolchain
        run: |
          test "$RUNNER_ARCH" = "X64"
          test "$(python -I -S -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test "$(uv --version)" = "uv 0.10.1"
          printf '%s  %s\n' \
            "e5571c1b0f31deec7f79ca60381f04a89f6cfe68f9b0d1c98cc2d372ec844bca" \
            "$(command -v uv)" | sha256sum --check --status
      - run: npm ci
      - run: uv sync --frozen --all-groups
      - run: docker build --pull -t backchannel:build-week .
      - name: Prepare masked non-disclosure canary
        run: |
          release_canary="sk-ci-$(openssl rand -hex 24)"
          echo "::add-mask::$release_canary"
          printf 'BACKCHANNEL_SMOKE_CANARY=%s\n' "$release_canary" >> "$GITHUB_ENV"
      - name: Start packaged app
        run: |
          docker volume create backchannel-ci-data >/dev/null
          container_id="$(docker run -d --name backchannel-ci \
            --user=10001:10001 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --security-opt=seccomp=builtin \
            --ipc=private \
            --cgroupns=private \
            --network=bridge \
            --pids-limit=128 \
            --restart=no \
            --mount type=volume,source=backchannel-ci-data,target=/data \
            -p 127.0.0.1:8000:8000 \
            -e BACKCHANNEL_ALLOWED_HOSTS=127.0.0.1 \
            -e BACKCHANNEL_CORS_ORIGINS=https://judge.example \
            -e BACKCHANNEL_IDENTITY_HASH_SECRET=ci-container-identity-boundary-0123456789 \
            -e OPENAI_API_KEY="$BACKCHANNEL_SMOKE_CANARY" \
            backchannel:build-week)"
          uv run python scripts/docker_runtime_contract.py \
            --container "$container_id" \
            --volume backchannel-ci-data \
            --port 8000
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          exit 1
      - run: npm run smoke:docker
      - run: npm run smoke:container:restart
      - name: Clean packaged resources
        if: always()
        run: |
          cleanup_failed=0
          if ! container_names="$(
            docker container ls --all --filter name=backchannel-ci --format '{{.Names}}'
          )"; then
            cleanup_failed=1
            container_names=""
          elif [ -n "$container_names" ]; then
            if [ "$container_names" != "backchannel-ci" ]; then
              cleanup_failed=1
            elif ! docker rm -f backchannel-ci >/dev/null; then
              cleanup_failed=1
            fi
          fi
          if ! volume_names="$(
            docker volume ls --filter name=backchannel-ci-data --format '{{.Name}}'
          )"; then
            cleanup_failed=1
            volume_names=""
          elif [ -n "$volume_names" ]; then
            if [ "$volume_names" != "backchannel-ci-data" ]; then
              cleanup_failed=1
            elif ! docker volume rm -f backchannel-ci-data >/dev/null; then
              cleanup_failed=1
            fi
          fi
          if ! container_names="$(
            docker container ls --all --filter name=backchannel-ci --format '{{.Names}}'
          )"; then
            cleanup_failed=1
          elif [ -n "$container_names" ]; then
            cleanup_failed=1
          fi
          if ! volume_names="$(
            docker volume ls --filter name=backchannel-ci-data --format '{{.Name}}'
          )"; then
            cleanup_failed=1
          elif [ -n "$volume_names" ]; then
            cleanup_failed=1
          fi
          test "$cleanup_failed" -eq 0
